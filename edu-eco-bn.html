<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ecosystem Builder (Bengali Edition)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Source+Code+Pro:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient-start: #020617;
      --bg-gradient-end: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.4);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent-primary: #22d3ee;
      --accent-hover: #67e8f9;
      --accent-success: #10b981;
      --code-bg: rgba(0, 0, 0, 0.3);
      --shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
      --input-bg: rgba(15, 23, 42, 0.6);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: fixed linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
      color: var(--text-primary);
      line-height: 1.6;
      padding: 60px 20px;
      min-height: 100vh;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #fff;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .sub-header {
      color: var(--accent-primary);
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.05em;
    }

    .input-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      margin-bottom: 40px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--accent-primary);
      letter-spacing: 0.08em;
    }

    textarea {
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      resize: vertical;
      min-height: 120px;
      transition: all 0.3s;
      outline: none;
    }

    textarea:focus {
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 2px rgba(34, 211, 238, 0.1);
    }

    .prompt-workflow {
      display: flex;
      flex-direction: column;
      gap: 30px;
    }

    .step-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 30px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .step-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .step-label {
      font-weight: 800;
      font-size: 0.85rem;
      background: var(--accent-primary);
      color: #020617;
      padding: 4px 14px;
      border-radius: 6px;
      text-transform: uppercase;
    }

    .prompt-content {
      background: var(--code-bg);
      padding: 25px;
      border-radius: 12px;
      font-family: 'Source Code Pro', monospace;
      font-size: 0.95rem;
      color: #cbd5e1;
      white-space: pre-wrap;
      border: 1px solid rgba(255,255,255,0.05);
      margin-bottom: 20px;
      line-height: 1.5;
      max-height: 600px;
      overflow-y: auto;
    }

    .copy-btn {
      background: rgba(34, 211, 238, 0.1);
      color: var(--accent-primary);
      border: 1px solid var(--accent-primary);
      padding: 12px 28px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s;
      width: 100%;
    }

    .copy-btn:hover {
      background: var(--accent-primary);
      color: #020617;
    }

    .copy-btn.copied {
      background: var(--accent-success);
      border-color: var(--accent-success);
      color: white;
    }

    .footer {
      margin-top: 80px;
      text-align: center;
      color: var(--text-secondary);
      font-size: 0.85rem;
      border-top: 1px solid var(--card-border);
      padding-top: 40px;
    }

    @media (max-width: 850px) {
      h1 { font-size: 1.8rem; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Ecosystem Builder (Bengali Audience Edition)</h1>
      <p class="sub-header">Bengali Language & Intellectual Strategy Engine</p>
    </header>

    <div class="input-grid">
      <div class="input-group">
        <label>Insert Topic / Lesson / Belief / Idea Here</label>
        <textarea id="val1" oninput="updatePrompts()" placeholder="e.g., The importance of mindfulness in modern education..."></textarea>
      </div>
    </div>

    <div class="prompt-workflow">
      <div class="step-card">
        <div class="step-header">
          <span class="step-label">Intellectual Ecosystem Blueprint</span>
        </div>
        <div class="prompt-content" id="p1_out"></div>
        <button class="copy-btn" onclick="copyText('p1_out', this)">
          <span>Copy Prompt</span>
        </button>
      </div>
    </div>

    <footer class="footer">
      <p>Copyright &copy; <script>document.write(new Date().getFullYear())</script> Siva Prasad Mukherjee. All Rights Reserved.</p>
    </footer>
  </div>

  <script>
    function updatePrompts() {
      const topic = document.getElementById('val1').value || "[INSERT TOPIC / LESSON / BELIEF / IDEA HERE]";

      const prompt = `Act as a world-class thinker, writer, intellectual strategist, educator, and audience-building expert with deep understanding of Bengali language, culture, society, and audience behavior.

I will provide a topic, concept, lesson, educational subject, conviction, observation, philosophy, worldview, belief, insight, recurring theme, or body of knowledge that I care deeply about.

Your task is NOT to merely summarize it.

Instead, treat it as the seed of an intellectual ecosystem and show how the same fundamental idea would be expressed across different platforms for a Bengali-speaking audience.

INPUT:

${topic}

INSTRUCTIONS:

1. First identify and articulate:

- Core Idea
- Core Thesis
- Core Message

Do not simply repeat my input.

Refine, clarify, strengthen, and elevate it into a more powerful, intellectually compelling, and universally meaningful form.

If the input is an educational lesson, chapter, concept, or subject, identify the underlying principle, fundamental insight, or central idea that gives the lesson its broader significance.

2. Then explain how this same Core Message would be expressed differently on:

- WhatsApp Channel
- Newsletter
- Blog
- Podcast
- Community
- Book

For each platform:

A. Explain the platform's role within the intellectual ecosystem.

B. Explain what the creator is trying to accomplish on that platform.

C. Explain how the Core Message should be adapted for that platform while remaining faithful to the underlying idea.

D. Provide 3 realistic examples of content that could be published on that platform.

3. Create a table:

| Platform | Primary Goal | Content Style | Audience Experience |

4. Create an "Intellectual Ecosystem Flow":

Discovery
↓
Interest
↓
Engagement
↓
Understanding
↓
Transformation
↓
Contribution
↓
Legacy

Explain what happens at each stage.

5. Finally answer:

"What is the single unifying idea behind all these platforms?"

Explain how the same truth, principle, or insight is being communicated through different media without changing its underlying meaning.

LANGUAGE & AUDIENCE REQUIREMENTS

- Write the entire output in natural Bengali (India).
- Write for Bengali-speaking readers and listeners.
- Use clear, elegant, intellectually rich Bengali.
- Avoid unnatural translations and excessive English.
- Connect ideas to Bengali culture, literature, education, society, history, and everyday experience whenever relevant.

IMPORTANT RULES

- Think like a serious public intellectual, educator, philosopher, and builder of ideas—not a social media marketer.
- Focus on ideas, principles, philosophy, human behavior, society, culture, meaning, wisdom, learning, intellectual development, and long-term influence.
- Avoid generic marketing advice.
- Make the analysis deep, nuanced, intellectually rich, and strategically insightful.
- Show the distinct purpose each platform serves within a larger ecosystem of thought.
- Treat the output as a blueprint for building a long-term body of work around the idea.
- The Core Idea, Core Thesis, and Core Message must be generated by you based on the input, not copied from it.
- Emphasize depth, coherence, and intellectual continuity across all platforms.
- Whenever possible, connect the idea to broader human questions, enduring principles, and timeless themes.
- Do not merely explain how to create content. Explain how ideas spread, mature, influence minds, build communities, and eventually become a lasting intellectual legacy.`;

      document.getElementById('p1_out').innerText = prompt;
    }

    function copyText(id, btn) {
      const text = document.getElementById(id).innerText;
      navigator.clipboard.writeText(text).then(() => {
        const originalText = btn.innerHTML;
        btn.innerHTML = `<span>Copied to Clipboard!</span>`;
        btn.classList.add('copied');
        
        setTimeout(() => {
          btn.innerHTML = originalText;
          btn.classList.remove('copied');
        }, 2000);
      });
    }

    // Initial setup
    updatePrompts();
  </script>
</body>
</html>
