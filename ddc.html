<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dumb Doc Clarifications - Prompt Genie</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Source+Code+Pro:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient-start: #020617;
      --bg-gradient-end: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.4);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent-primary: #22d3ee;
      --accent-hover: #67e8f9;
      --accent-success: #10b981;
      --code-bg: rgba(0, 0, 0, 0.3);
      --shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: fixed linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
      color: var(--text-primary);
      line-height: 1.6;
      padding: 60px 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      max-width: 700px;
      width: 100%;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 60px;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #fff;
      text-transform: uppercase;
    }

    .prompt-workflow {
      display: flex;
      flex-direction: column;
      gap: 30px;
    }

    .step-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 40px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .step-header {
      display: flex;
      justify-content: flex-start;
      margin-bottom: 25px;
    }

    .step-label {
      font-weight: 800;
      font-size: 0.8rem;
      background: var(--accent-primary);
      color: #020617;
      padding: 5px 16px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .input-label {
      display: block;
      color: var(--accent-primary);
      font-weight: 700;
      font-size: 0.8rem;
      text-transform: uppercase;
      margin-bottom: 8px;
      margin-top: 20px;
    }

    .dynamic-input {
      width: 100%;
      background: var(--code-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 15px;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      resize: vertical;
      min-height: 100px;
      outline: none;
      transition: border-color 0.2s;
    }

    .dynamic-input:focus {
      border-color: var(--accent-primary);
    }

    .prompt-content {
      background: var(--code-bg);
      padding: 30px;
      border-radius: 12px;
      font-family: 'Source Code Pro', monospace;
      font-size: 1.05rem;
      color: #cbd5e1;
      white-space: pre-wrap;
      border: 1px solid rgba(255,255,255,0.05);
      margin-bottom: 25px;
      line-height: 1.6;
      word-break: break-all;
    }

    .button-group {
      display: flex;
      gap: 15px;
      flex-direction: column;
    }

    .btn {
      padding: 14px 32px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s;
      width: 100%;
      text-decoration: none;
      border: none;
    }

    .copy-btn {
      background: rgba(34, 211, 238, 0.1);
      color: var(--accent-primary);
      border: 1px solid var(--accent-primary);
    }

    .copy-btn:hover {
      background: var(--accent-primary);
      color: #020617;
    }

    .copy-btn.copied {
      background: var(--accent-success);
      border-color: var(--accent-success);
      color: white;
    }

    .footer {
      margin-top: 80px;
      text-align: center;
      color: var(--text-secondary);
      font-size: 0.85rem;
      border-top: 1px solid var(--card-border);
      padding-top: 40px;
      width: 100%;
    }

    @media (max-width: 600px) {
      h1 { font-size: 1.6rem; }
      .step-card { padding: 25px; }
      .prompt-content { font-size: 0.95rem; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Dumb Doc Clarifications.</h1>
    </header>

    <div class="prompt-workflow">
      
      <!-- Input Card -->
      <div class="step-card">
        <div class="step-header">
          <span class="step-label">Input Details</span>
        </div>
        
        <label class="input-label">পয়েন্ট</label>
        <textarea id="pointInput" class="dynamic-input" placeholder="পয়েন্ট এখানে লিখুন..." oninput="updatePrompt()"></textarea>
        
        <label class="input-label">উত্তর</label>
        <textarea id="ansInput" class="dynamic-input" placeholder="উত্তর এখানে লিখুন..." oninput="updatePrompt()"></textarea>
      </div>

      <!-- Result Card -->
      <div class="step-card">
        <div class="step-header">
          <span class="step-label">Generated Prompt</span>
        </div>
        <div class="prompt-content" id="p1">“[আরও তথ্য প্রয়োজন]” — সম্পূর্ণ তালিকার একটা পয়েন্ট হ'ল:

[পয়েন্ট]

আমার উত্তর:

[উত্তর]


এই প্রশ্নটা ও তার উত্তরটা রিভিউ করে আমাকে জানাও।</div>
        <div class="button-group">
          <button class="btn copy-btn" onclick="copyText('p1', this)">
            <span>Copy Prompt</span>
          </button>
        </div>
      </div>

    </div>

    <footer class="footer">
      <p>Copyright &copy; <script>document.write(new Date().getFullYear())</script> Siva Prasad Mukherjee. All Rights Reserved.</p>
    </footer>
  </div>

  <script>
    function updatePrompt() {
        const point = document.getElementById('pointInput').value.trim() || '[পয়েন্ট]';
        const ans = document.getElementById('ansInput').value.trim() || '[উত্তর]';
        
        const template = `“[আরও তথ্য প্রয়োজন]” — সম্পূর্ণ তালিকার একটা পয়েন্ট হ'ল:

${point}

আমার উত্তর:

${ans}


এই প্রশ্নটা ও তার উত্তরটা রিভিউ করে আমাকে জানাও।`;

        document.getElementById('p1').innerText = template;
    }

    function copyText(id, btn) {
      const text = document.getElementById(id).innerText;
      navigator.clipboard.writeText(text).then(() => {
        const originalText = btn.innerHTML;
        btn.innerHTML = `<span>Copied to Clipboard!</span>`;
        btn.classList.add('copied');
        
        setTimeout(() => {
          btn.innerHTML = originalText;
          btn.classList.remove('copied');
        }, 2000);
      });
    }
  </script>
</body>
</html>
